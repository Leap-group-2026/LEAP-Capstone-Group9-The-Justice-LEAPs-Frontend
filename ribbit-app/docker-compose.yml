services:
  ribbit-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0}
        AUTH_URL: ${AUTH_URL:?Set AUTH_URL in .env}
        SPRING_URL: ${SPRING_URL:?Set SPRING_URL in .env}
    ports:
      - "${FRONTEND_PORT:-8083}:8083"
    environment:
      PORT: 8083
      NODE_ENV: production
    restart: unless-stopped