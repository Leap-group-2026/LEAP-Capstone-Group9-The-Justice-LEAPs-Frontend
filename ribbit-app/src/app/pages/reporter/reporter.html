<div class="reporter-page">
  <aside class="reporter-sidebar" aria-label="Reporter navigation">
    <p class="sidebar-label">REPORTER</p>
    <button
      type="button"
      [class.active]="activeSection === 'analytics'"
      (click)="selectSection('analytics')"
    >
      Analytics
    </button>
    <button
      type="button"
      [class.active]="activeSection === 'placeholder'"
      (click)="selectSection('placeholder')"
    >
      Placeholder
    </button>
  </aside>

  <section class="reporter-content" aria-live="polite">
    @if (activeSection === 'analytics') {
      <div>
        <p class="eyebrow">REPORTING</p>
        <h1>Analytics</h1>
        <p class="intro">Review platform activity and performance reporting.</p>
      </div>
      <div class="analytics-placeholder" role="img" aria-label="Analytics content placeholder">
        Analytics content
      </div>
    } @else {
      <div>
        <p class="eyebrow">REPORTING</p>
        <h1>Placeholder</h1>
        <p class="intro">This reporting area is ready for the next view.</p>
      </div>
    }
  </section>
</div>
