<div class="app-shell" [style.--sidebar-width]="sidebarCollapsed ? '80px' : '214px'">
  <header class="topbar">
    <button
      class="icon-button mobile-menu"
      type="button"
      aria-label="Toggle navigation"
      aria-controls="main-sidebar"
      [attr.aria-expanded]="sidebarOpen"
      (click)="sidebarOpen = !sidebarOpen"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path [attr.d]="icons['menu']"/>
      </svg>
    </button>

    <button class="brand" type="button" (click)="navigate('dashboard')">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
        <path
          d="M5 8C5 3 11 3 11 8h6c0-5 6-5 6 0v6c0 7-4 10-9 10S5 21 5 14Z"
          fill="currentColor"
          stroke="none"
        />
        <path d="M10 14c1 3 7 3 8 0" stroke="#090b0a" stroke-width="2"/>
      </svg>
      <span>ribbit</span>
    </button>

    <div class="header-title">
      <span>{{ pageTitle }}</span>
      <small>INDIVIDUAL ACCOUNT</small>
    </div>

    <button
      class="profile"
      type="button"
      aria-label="Open account"
      (click)="navigate('account')"
    >
      <span class="avatar">{{ user.initials }}</span>
      <span class="profile-details">
        <strong>{{ user.name }}</strong>
        <small>ACCT · •••• {{ user.accountEnding }}</small>
      </span>
      <span aria-hidden="true">⌄</span>
    </button>
  </header>

  @if (sidebarOpen) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Close navigation"
      (click)="sidebarOpen = false"
    ></button>
  }

  <aside
    id="main-sidebar"
    class="sidebar"
    [class.open]="sidebarOpen"
    [class.collapsed]="sidebarCollapsed"
  >
    <div class="sidebar-header">
      <div class="sidebar-label">{{ sidebarCollapsed ? '' : 'WORKSPACE' }}</div>
      <button
        class="collapse-button"
        type="button"
        aria-label="Toggle sidebar collapse"
        [attr.aria-pressed]="sidebarCollapsed"
        (click)="sidebarCollapsed = !sidebarCollapsed"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="sidebarCollapsed ? icons['expand'] : icons['collapse']"/>
        </svg>
      </button>
    </div>

    <nav aria-label="Main navigation">
      @for (item of navigation; track item.id) {
        <button
          class="nav-item"
          type="button"
          [class.active]="item.id === currentPage"
          [attr.aria-current]="item.id === currentPage ? 'page' : null"
          (click)="navigate(item.id)"
          [title]="sidebarCollapsed ? item.label : ''"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="icons[item.icon]"/>
          </svg>
          @if (!sidebarCollapsed) {
            <span>{{ item.label }}</span>
          }
        </button>
      }
    </nav>

    <div class="sidebar-bottom">
      <div class="market-status" [class.collapsed]="sidebarCollapsed">
        <span><i></i> {{ sidebarCollapsed ? '' : 'MARKET OPEN' }}</span>
        @if (!sidebarCollapsed) {
          <p>NYSE · Closes at 4:00 PM ET</p>
          <small>Mock market session</small>
        }
      </div>

      <button class="nav-item" type="button" (click)="navigate('account')" [title]="sidebarCollapsed ? 'Help & support' : ''">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="icons['support']"/>
        </svg>
        @if (!sidebarCollapsed) {
          <span>Help &amp; support</span>
        }
      </button>

      <button class="nav-item" type="button" (click)="navigate('logout')" [title]="sidebarCollapsed ? 'Logout' : ''">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="icons['logout']"/>
        </svg>
        @if (!sidebarCollapsed) {
          <span>Logout</span>
        }
      </button>

      <small class="copyright" [style.display]="sidebarCollapsed ? 'none' : 'block'">© 2026 Ribbit Financial</small>
    </div>
  </aside>

  <main class="main-content">
    <ng-content></ng-content>
  </main>
</div>
